# Run Recce with one command:  docker compose up --build
# Then open http://localhost:8000
#
# Keys are optional. With none set, Recce runs in demo mode. To go live, put them
# in a .env file in this folder (compose reads it automatically) or pass them inline:
#   GEMINI_API_KEY=... GOOGLE_MAPS_API_KEY=... docker compose up --build
services:
  recce:
    build: .
    image: recce:latest
    ports:
      - "8000:8080"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_PRO_MODEL: ${GEMINI_PRO_MODEL:-gemini-2.5-pro}
      RECCE_IMAGE_MODEL: ${RECCE_IMAGE_MODEL:-imagen-4.0-fast-generate-001}
      RECCE_BASE_CITY: ${RECCE_BASE_CITY:-Los Angeles, CA}
      RECCE_LOCATION_DATA: ${RECCE_LOCATION_DATA:-}
      RECCE_OSRM_URL: ${RECCE_OSRM_URL:-}
      RECCE_WEATHER_PROVIDER: ${RECCE_WEATHER_PROVIDER:-demo}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
    restart: unless-stopped

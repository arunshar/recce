[pytest]
markers =
    unit: isolated function and module behavior
    integration: API and module integration behavior
    e2e: end-to-end workflow behavior
    smoke: fast service health and workflow sanity checks
    contract: API/schema response contract checks
    regression: golden demo-data and fallback behavior checks
    performance: deterministic local performance checks
    security: security and deploy configuration checks
    k8s: Kubernetes manifest checks
